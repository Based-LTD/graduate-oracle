[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

# Order matters loosely: observer fills the snapshot file before web reads it.
# Web service serves the dashboard + API on port 8765 (Fly proxies to this).
# Bot polls TG independently. Bot also reads the same DB and snapshot.

[program:observer-daemon]
command=/usr/local/bin/observer-daemon --config /app/config.toml
directory=/app
autorestart=true
autostart=true
priority=10
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=RUST_LOG=info,HOME="/root"

[program:web]
command=python -u /app/web/main.py
directory=/app/web
autorestart=true
autostart=true
priority=20
startsecs=10
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
# Track 1 (Option 4 from web_service_memory_pressure_postmortem_2026_05_12.md):
# jemalloc + PYTHONMALLOC=malloc to address C-extension allocator
# fragmentation under sustained sklearn/numpy workload. Yesterday's
# heap audit showed 13× more growth in untracked memory than gc-visible
# Python heap. jemalloc compacts and returns pages to OS more
# aggressively than CPython's default malloc. Per Track 1 acceptance
# criterion: VmRSS growth rate over 1h post-deploy determines whether
# the memory_watchdog daemon can be disabled (PASS <30 MB/min), kept
# as belt-and-suspenders (PARTIAL 30-70), or replaced by Option 2
# in-lane-only scoring (FAIL >70).
environment=PYTHONUNBUFFERED="1",LD_PRELOAD="/usr/lib/x86_64-linux-gnu/libjemalloc.so.2",PYTHONMALLOC="malloc"

[program:bot]
command=python -u /app/bot/main.py
directory=/app
autorestart=true
autostart=true
priority=30
startsecs=10
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

# Case Study Harness daemon (Phase 2 scaffold, 2026-05-08).
# Idle in trigger-wait state until configured start_at_ts (Finding 8
# deploy + 48h = 2026-05-09T16:45:54Z). Read-only against production
# DB; writes to separate /data/case_studies.sqlite. Per Case Study 01
# pre-reg (commit 5bc8f33).
# autorestart=false: this daemon runs once per study (~72h total: 48h
# collection + 24h grace), then exits cleanly. Restart on crash would
# corrupt the trigger-wait semantics. Operator manually re-arms for
# Studies 02+ via fly ssh.
[program:case_study_harness]
command=python -u -m case_study_harness.run_study --config /app/case_study_harness/configs/study_01_gmgn.toml
directory=/app
autorestart=false
autostart=true
priority=40
startsecs=10
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

# Weekly GBM retrain — see scripts/retrain_scheduler.py. Subprocess pattern
# keeps HistGB's ~1.5GB transient out of the web process's address space.
# Starts in shadow mode (RETRAIN_AUTO_SWAP=0) — candidate artifacts written,
# never swapped, alert row inserted on every cycle. Flip RETRAIN_AUTO_SWAP=1
# (Fly secret) once gate verdict has been trustworthy for ≥2 weeks.
[program:retrain_scheduler]
command=python -u /app/scripts/retrain_scheduler.py
directory=/app
autorestart=true
autostart=true
priority=50
startsecs=10
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",RETRAIN_AUTO_SWAP="1"

# Trader auto-exit monitor — polls Jupiter every 10s per open position
# for every admin in ADMIN_TG_IDS, fires sells when TP/SL/TSL conditions
# hit. Off by default: requires both TRADER_ENABLED=1 (registered) AND
# TRADER_MONITOR_LIVE=1 (actually submit sells) on the env.
# Without TRADER_MONITOR_LIVE the daemon runs in DRY-RUN mode (logs what
# WOULD happen but never sells). This is the safety net.
[program:trader_monitor]
command=python -u /app/web/trader_monitor_daemon.py
directory=/app/web
autorestart=true
autostart=true
priority=60
startsecs=10
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"
