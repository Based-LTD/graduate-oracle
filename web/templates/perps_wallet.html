<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>perps · wallet drill-down · graduate-oracle</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Per-wallet perps intel: live positions, win rate at +5m/+1h/+24h, recent smart-money entries.">
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
.drill-main { max-width: 1100px; margin: 24px auto 60px; padding: 0 16px; font-family: 'JetBrains Mono', monospace; }
.drill-back {
  display: inline-block; color: #80c0ff; text-decoration: none;
  font-size: 12px; margin-bottom: 16px; letter-spacing: 0.06em;
}
.drill-back:hover { text-decoration: underline; }
.drill-hero { padding: 18px 0 14px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
.drill-hero h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(20px, 4vw, 32px);
  font-weight: 800; margin: 0 0 6px;
  color: #fff; letter-spacing: 0.02em;
  word-break: break-all;
}
.drill-hero .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.drill-hero .b {
  font-size: 10px; letter-spacing: 0.14em; font-weight: 700;
  padding: 3px 8px; border-radius: 3px;
  text-transform: uppercase;
}
.drill-hero .b.smart { color: #88e0aa; border: 1px solid rgba(120,200,140,0.55); background: rgba(120,200,140,0.10); }
.drill-hero .b.whale { color: #80c0ff; border: 1px solid rgba(120,180,255,0.55); background: rgba(120,180,255,0.10); }
.drill-hero a { color: #80c0ff; text-decoration: none; font-size: 12px; margin-right: 12px; }
.drill-hero a:hover { text-decoration: underline; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 22px; }
.stat-card { border: 1px solid var(--border); border-radius: 4px; padding: 10px 14px; background: rgba(0,0,0,0.4); text-align: center; }
.stat-card .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 4px; }
.stat-card .value { font-size: 18px; color: #fff; font-weight: 700; }
.stat-card .value.pos { color: #88e0aa; }
.stat-card .value.neg { color: #ff9090; }

.sec { font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: #80c0ff; margin: 28px 0 10px; }

.tbl { width: 100%; border-collapse: collapse; font-size: 12px; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.tbl th, .tbl td { padding: 8px 12px; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.04); }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl thead th { font-size: 10px; color: var(--muted); letter-spacing: 0.10em; text-transform: uppercase; background: rgba(255,255,255,0.02); }
.tbl tbody tr:last-child td { border-bottom: none; }
.tbl td.name { color: #fff; font-weight: 600; }
.tbl td.pos { color: #88e0aa; font-weight: 700; }
.tbl td.neg { color: #ff9090; font-weight: 700; }
.tbl a { color: #80c0ff; text-decoration: none; }
.tbl a:hover { text-decoration: underline; }

.warmup { color: var(--muted); padding: 24px 0; text-align: center; font-size: 12px; }
</style>
</head>
<body>
<div class="bg-ambience" aria-hidden="true"></div>

<header>
  <div class="brand">
    <a href="/" style="text-decoration:none">
      <div class="logo"><span class="g">GRADUATE</span></div>
      <div class="logo-oracle">O R A C L E</div>
    </a>
    <div class="tagline">pump<span class="dot-sep">.</span>fun decoded</div>
  </div>
  <button class="head-hamburger" aria-label="Menu" onclick="this.nextElementSibling.classList.toggle(&apos;open&apos;)"><span></span><span></span><span></span></button>
  <nav class="head-nav">
    <a class="head-link" href="/">LIVE</a>
    <a class="head-link" href="/conditions">CONDITIONS</a>
    <a class="head-link active" href="/perps">PERPS</a>
    <a class="head-link" href="/calls">CALLS</a>
    <a class="head-link" href="/accuracy">ACCURACY</a>
    <a class="head-link" href="/bot">TG BOT</a>
    <a class="head-link" href="/api">API</a>
    <a class="head-link" href="/cli">CLI</a>
    <a class="head-link" href="/docs">DOCS</a>
  </nav>
  <a class="head-x-link" href="https://x.com/GraduateOracle" target="_blank" rel="noopener" title="@GraduateOracle on X">
    <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
  </a>
  <a class="head-dex-link" href="https://dexscreener.com/solana/dhapj3z14jhsy1lacssvi8bufdt7q7eaniuyeptarqu3" target="_blank" rel="noopener" title="$GO chart on DEX Screener">
    <img src="/static/brand/dexscreener.png" alt="DEX Screener" width="22" height="22">
  </a>
</header>

<main class="drill-main">
  <a class="drill-back" href="/perps">← back to perps observatory</a>
  <section class="drill-hero">
    <div class="badges" id="badges"></div>
    <h1 id="addr">loading…</h1>
    <div id="links"></div>
  </section>

  <div class="stat-grid" id="stats"></div>

  <h2 class="sec">🧾 Per-horizon win rate</h2>
  <div class="stat-grid" id="winrates"></div>

  <h2 class="sec">📊 Current open positions</h2>
  <div id="positions-wrap"></div>

  <h2 class="sec">⚡ Recent entries detected</h2>
  <div id="entries-wrap"></div>
</main>

<script>
const $ = id => document.getElementById(id);
function fmtUsd(n){ if(n == null) return '—'; const x = Number(n); if(Math.abs(x)>=1e9) return '$'+(x/1e9).toFixed(2)+'B'; if(Math.abs(x)>=1e6) return '$'+(x/1e6).toFixed(2)+'M'; if(Math.abs(x)>=1e3) return '$'+(x/1e3).toFixed(1)+'K'; return '$'+x.toFixed(0); }
function fmtPct(p){ return p == null ? '—' : (p*100).toFixed(1)+'%'; }
function fmtAgo(s){ if(s<60) return s+'s'; if(s<3600) return Math.floor(s/60)+'m'; if(s<86400) return Math.floor(s/3600)+'h'; return Math.floor(s/86400)+'d'; }
function shortAddr(a){ return a ? a.slice(0,6)+'…'+a.slice(-4) : '—'; }

const addr = location.pathname.split('/').pop();

async function load(){
  $('addr').textContent = addr;
  const r = await fetch('/api/perps/wallet/' + addr);
  const d = await r.json();
  if(!d.found){
    $('addr').textContent = addr;
    $('stats').innerHTML = '<div class="warmup">Wallet not in our tracked set yet. We snapshot the top 500 of the Hyperliquid leaderboard; this address hasn\\'t been seen.</div>';
    return;
  }
  const m = d.meta || {};
  $('addr').textContent = m.address || addr;
  // badges
  const badges = [];
  if(m.is_smart) badges.push(`<span class="b smart">🧠 SMART</span>`);
  if(m.is_whale) badges.push(`<span class="b whale">🐋 WHALE</span>`);
  $('badges').innerHTML = badges.join('');
  $('links').innerHTML = `
    <a href="https://app.hyperliquid.xyz/explorer/address/${m.address}" target="_blank" rel="noopener">Hyperliquid explorer ↗</a>
    <a href="https://hyperscreener.asxn.xyz/account/${m.address}" target="_blank" rel="noopener">Hyperscreener ↗</a>
  `;

  // top stats
  const roi = (m.month_roi || 0) * 100;
  const allTime = m.all_time_pnl;
  $('stats').innerHTML = `
    <div class="stat-card"><div class="label">Account value</div><div class="value">${fmtUsd(m.account_value)}</div></div>
    <div class="stat-card"><div class="label">30d ROI</div><div class="value ${roi>=0?'pos':'neg'}">${roi>=0?'+':''}${roi.toFixed(1)}%</div></div>
    <div class="stat-card"><div class="label">30d PnL</div><div class="value ${(m.month_pnl||0)>=0?'pos':'neg'}">${fmtUsd(m.month_pnl)}</div></div>
    <div class="stat-card"><div class="label">All-time PnL</div><div class="value ${(allTime||0)>=0?'pos':'neg'}">${fmtUsd(allTime)}</div></div>
    <div class="stat-card"><div class="label">30d volume</div><div class="value">${fmtUsd(m.month_vlm)}</div></div>
  `;

  // win rates
  const wr = d.win_rates || {};
  $('winrates').innerHTML = ['5m','1h','24h'].map(h => {
    const v = wr[h] || {status:'warming', n:0};
    if(v.status !== 'ok') return `<div class="stat-card"><div class="label">+${h}</div><div class="value">warming…</div></div>`;
    return `<div class="stat-card"><div class="label">+${h} · n=${v.n}</div><div class="value ${v.hit_rate>=0.5?'pos':'neg'}">${(v.hit_rate*100).toFixed(1)}%</div></div>`;
  }).join('');

  // positions
  const ps = d.current_positions || [];
  if(ps.length === 0){
    $('positions-wrap').innerHTML = '<div class="warmup">No open positions in our last snapshot.</div>';
  } else {
    $('positions-wrap').innerHTML = `<table class="tbl"><thead><tr><th>Market</th><th>Side</th><th>Size (USD)</th><th>Entry</th><th>Leverage</th><th>Unrealized PnL</th></tr></thead><tbody>${
      ps.map(p => `<tr>
        <td class="name"><a href="/perps/market/${p.market}">${p.market}</a></td>
        <td class="${p.side === 'long' ? 'pos' : 'neg'}">${p.side.toUpperCase()}</td>
        <td>${fmtUsd(p.position_value_usd)}</td>
        <td>$${(p.entry_px||0).toLocaleString(undefined,{maximumFractionDigits:4})}</td>
        <td>${p.leverage ? p.leverage+'×' : '—'}</td>
        <td class="${(p.unrealized_pnl||0)>=0?'pos':'neg'}">${fmtUsd(p.unrealized_pnl)}</td>
      </tr>`).join('')
    }</tbody></table>`;
  }

  // entries
  const ents = d.recent_entries || [];
  if(ents.length === 0){
    $('entries-wrap').innerHTML = '<div class="warmup">No entries logged for this wallet yet.</div>';
  } else {
    const now = Math.floor(Date.now()/1000);
    $('entries-wrap').innerHTML = `<table class="tbl"><thead><tr><th>When</th><th>Market</th><th>Side</th><th>Size</th><th>Entry</th><th>Lev</th><th>+5m</th><th>+1h</th><th>+24h</th></tr></thead><tbody>${
      ents.slice(0, 30).map(e => {
        const age = Math.max(0, now - e.detected_at_unix);
        const oc = (v) => v == null ? '—' : `<span class="${v>=0?'pos':'neg'}">${v>=0?'+':''}${(v*100).toFixed(2)}%</span>`;
        return `<tr>
          <td>${fmtAgo(age)} ago</td>
          <td class="name"><a href="/perps/market/${e.market}">${e.market}</a></td>
          <td class="${e.side === 'long' ? 'pos' : 'neg'}">${e.side.toUpperCase()}</td>
          <td>${fmtUsd(e.position_value_usd)}</td>
          <td>$${(e.entry_px||0).toLocaleString(undefined,{maximumFractionDigits:4})}</td>
          <td>${e.leverage ? e.leverage+'×' : '—'}</td>
          <td>${oc(e.outcome_5m_pct)}</td>
          <td>${oc(e.outcome_1h_pct)}</td>
          <td>${oc(e.outcome_24h_pct)}</td>
        </tr>`;
      }).join('')
    }</tbody></table>`;
  }
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
